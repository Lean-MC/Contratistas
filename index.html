<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylePrincipal.css">
    <title>SoloProf</title>
</head>
<body>

    <!-- <header class="header">-->

        <header class="header">
            <nav>
                <div class="logo">
                    <a href="/index.html">
                        <img src="/images/logo.png" alt="SoloProf Logo" />
                    </a>
                </div>
                <input type="checkbox" id="menu-toggle">
                <label for="menu-toggle" class="menu-icon">&#9776;</label>
                <ul class="menu">
                    <li><a href="/index.html">Home</a></li>
                    <li><a href="#">Legales</a></li>
                    <li><a href="#">Publicar</a></li>
                </ul>
            </nav>
        </header>
    


    
 <!-- Botón para mostrar el filtro -->
 <button id="filter-btn" class="btn-filter">Filtrar</button>

 <!-- Contenedor del filtro, inicialmente oculto -->
 <div id="filter-container" class="filter-container" style="display: none;">
     <!-- Botón para cerrar el contenedor de filtros -->
     <button id="close-filter-btn" class="btn-close">X</button>
     <div class="filter-group">
     <label for="specialist-filter">Especialista:</label>
     <select id="specialist-filter" class="form-select" aria-label="Seleccionar especialista">
         <option value="all">Todos</option>
         <option value="electricista">Electricistas</option>
         <option value="arreglos-varios">Arreglos Generales</option>
         <!-- Agrega más opciones según tus categorías -->
     </select>
    </div>

    <div class="filter-group">
     <label for="zone-filter">Zona:</label>
     <select id="zone-filter" class="form-select" aria-label="Seleccionar Zona">
         <option value="all">Todos</option>
         <option value="Amba">Amba</option>
         <option value="CABA">CABA</option>
         <option value="BellaVista">Bella Vista</option>
     </select>
    </div>
     <!-- Botón para aplicar el filtro -->
     <button id="apply-filter-btn" class="btn-apply">Aplicar Filtro</button>
 </div>

 <!-- Contenido principal -->
 <main>
     <section class="services">
         <!-- Ejemplo de tarjeta -->
         <div class="card electricista BellaVista">
             <div class="card__img">
                 <img src="contratistas/imgFondo/2.jfif" alt="Card Image">
             </div>
            
             <div class="card__title">Prueba1</div>
             <div class="card__subtitle">Electricista</div>
             <div class="card__zone">Bella Vista</div>
             <button class="card__btn"><a href="contratistas/Pages/Prueba.html">Contactar</a></button>
         </div>

         <!-- Otro ejemplo de tarjeta -->
         <div class="card arreglos-varios Amba">
             <div class="card__img">
                 <img src="contratistas/imgFondo/11.jfif" alt="Card Image">
             </div>
             <div class="card__title">Prueba2</div>
             <div class="card__subtitle">Arreglos varios</div>
             <div class="card__zone">AMBA</div>
             <button class="card__btn"><a href="contratistas/Pages/Prueba2.html">Contactar</a></button>
         </div>

         <!-- Otro ejemplo de tarjeta -->
         <div class="card electricista CABA">
             <div class="card__img">
                 <img src="contratistas/imgFondo/5.jfif" alt="Card Image">
             </div>
             <div class="card__title">Prueba3</div>
             <div class="card__subtitle">Electricista</div>
             <div class="card__zone">CABA</div>
             <button class="card__btn"><a href="contratistas/Pages/Prueba3.html">Contactar</a></button>
         </div>
     </section>
 </main>

    <footer>
        <p>&copy; 2024 Your Company. All rights reserved.</p>
        <p><a href="#">Legal Information</a></p>
    </footer>
    <script src="/scripts/carga.js"></script>
    <script src="/scripts/filtro.js"></script>
    <script src="/scripts/galeria.js"></script>
        <!-- <script src="scripts/carga.js"></script>-->
        <script>
            // Mostrar el contenedor de filtros al hacer clic en el botón de filtrar
document.getElementById('filter-btn').addEventListener('click', function() {
    document.getElementById('filter-container').style.display = 'block';
    this.style.display = 'none'; // Ocultar el botón de filtrar
});

// Aplicar el filtro y ocultar el contenedor de filtros
document.getElementById('apply-filter-btn').addEventListener('click', function() {
    var specialistFilterValue = document.getElementById('specialist-filter').value;
    var zoneFilterValue = document.getElementById('zone-filter').value;
    var cards = document.querySelectorAll('.card');

    cards.forEach(function(card) {
        var matchesSpecialist = (specialistFilterValue === 'all' || card.classList.contains(specialistFilterValue));
        var matchesZone = (zoneFilterValue === 'all' || card.classList.contains(zoneFilterValue));

        if (matchesSpecialist && matchesZone) {
            card.style.display = 'flex';
        } else {
            card.style.display = 'none';
        }
    });

    document.getElementById('filter-container').style.display = 'none'; // Ocultar el contenedor de filtros
    document.getElementById('filter-btn').style.display = 'block'; // Mostrar el botón de filtrar
});

// Cerrar el contenedor de filtros al hacer clic en el botón de cierre
document.getElementById('close-filter-btn').addEventListener('click', function() {
    document.getElementById('filter-container').style.display = 'none'; // Ocultar el contenedor de filtros
    document.getElementById('filter-btn').style.display = 'block'; // Mostrar el botón de filtrar
});

        </script>
        

</body>
</html>
